    const CATEGORIES = [

    // ==========================================
    // MAIN APP COMPONENT
    // ==========================================
    function App() {
      // --- State: Data ---
      const [products, setProducts] = useState(() => {
        const saved = localStorage.getItem("tc_products");
        return saved ? JSON.parse(saved) : DEFAULT_PRODUCTS;
      });

      const [cart, setCart] = useState(() => {
        const saved = localStorage.getItem("tc_cart");
        return saved ? JSON.parse(saved) : [];
      });

      const [wishlist, setWishlist] = useState(() => {
        const saved = localStorage.getItem("tc_wishlist");
        return saved ? JSON.parse(saved) : ["TC-101", "TC-107"];
      });

      const [orders, setOrders] = useState(() => {
        const saved = localStorage.getItem("tc_orders");
        return saved ? JSON.parse(saved) : [
          {
            id: "ORD-94821",
            date: "2026-10-28",
            customer: { name: "Tanvir Ahmed", phone: "+880 1711 000000", district: "Dhaka", area: "Gulshan 2", address: "Road 71, House 14" },
            items: [
              { id: "TC-101", name: "L’Élégance Cashmere Overcoat", price: 495, size: "L", color: "Onyx Black", quantity: 1 }
            ],
            total: 495,
            paymentMethod: "Cash on Delivery",
            status: "Delivered"
          }
        ];
      });

      // --- State: Auth ---
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem("tc_user");
        return saved ? JSON.parse(saved) : { name: "Guest VIP", email: "vip@thechoice.com", role: "customer" };
      });

      // --- Navigation View State ---
      // views: 'home' | 'shop' | 'product-detail' | 'checkout' | 'account' | 'admin' | 'wishlist'
      const [activeView, setActiveView] = useState("home");
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedCategory, setSelectedCategory] = useState("All Collections");
      const [sortOption, setSortOption] = useState("featured");
      const [notification, setNotification] = useState(null);

      // Save states
      useEffect(() => {
        localStorage.setItem("tc_products", JSON.stringify(products));
      }, [products]);

      useEffect(() => {
        localStorage.setItem("tc_cart", JSON.stringify(cart));
      }, [cart]);

      useEffect(() => {
        localStorage.setItem("tc_wishlist", JSON.stringify(wishlist));
      }, [wishlist]);

      useEffect(() => {
        localStorage.setItem("tc_orders", JSON.stringify(orders));
      }, [orders]);

      useEffect(() => {
        localStorage.setItem("tc_user", JSON.stringify(currentUser));
      }, [currentUser]);

      // --- Toast Notification ---
      const notify = (msg, type = "success") => {
        setNotification({ msg, type });
        setTimeout(() => setNotification(null), 3500);
      };

      // --- Cart Actions ---
      const addToCart = (product, size, color, quantity = 1) => {
        const chosenSize = size || product.sizes[0];
        const chosenColor = color || (product.colors[0]?.name || "Default");
        const existingIndex = cart.findIndex(
          item => item.id === product.id && item.size === chosenSize && item.color === chosenColor
        );

        let updated = [...cart];
        if (existingIndex > -1) {
          updated[existingIndex].quantity += quantity;
        } else {
          updated.push({
            id: product.id,
            name: product.name,
            price: product.price,
            image: product.images[0],
            size: chosenSize,
            color: chosenColor,
            quantity: quantity,
            stock: product.stock
          });
        }
        setCart(updated);
        notify(`Added "${product.name}" to your luxury bag.`);
        setIsCartOpen(true);
      };

      const updateCartQty = (index, delta) => {
        let updated = [...cart];
        const newQty = updated[index].quantity + delta;
        if (newQty <= 0) {
          updated.splice(index, 1);
          notify("Item removed from bag.");
        } else {
          updated[index].quantity = newQty;
        }
        setCart(updated);
      };

      const removeFromCart = (index) => {
        let updated = [...cart];
        updated.splice(index, 1);
        setCart(updated);
        notify("Item removed.");
      };

      const toggleWishlist = (id) => {
        if (wishlist.includes(id)) {
          setWishlist(wishlist.filter(x => x !== id));
          notify("Removed from Wishlist.");
        } else {
          setWishlist([...wishlist, id]);
          notify("Saved to your Personal Wishlist.");
        }
      };

      const cartTotal = useMemo(() => {
        return cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);
      }, [cart]);

      // --- Product Details Navigation ---
      const viewProductDetails = (product) => {
        setSelectedProduct(product);
        setActiveView("product-detail");
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <div className="min-h-screen flex flex-col bg-[#FAF9F6] text-brand-black">
          {/* Notification Toast */}
          {notification && (

          {/* Top VIP Marquee Announcement Bar */}

          </div>

          {/* Navigation Bar */}
          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-brand-border">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-20">

                <div 
                  onClick={() => { setActiveView("home"); setSelectedCategory("All Collections"); }}

                    THE CHOICE
                  </span>
                  <span className="text-[9px] tracking-[0.38em] text-brand-gold font-semibold -mt-1 uppercase">
                    CHOOSE YOUR STYLE.
                  </span>
                </div>

                {/* Desktop Primary Nav Links */}
                <nav className="hidden md:flex items-center space-x-8 text-xs font-semibold uppercase tracking-[0.18em]">
                  <button 
                    onClick={() => { setActiveView("home"); }}
                    className={`pb-1 transition-all ${activeView === 'home' ? 'border-b-2 border-brand-gold text-brand-black' : 'text-neutral-500 hover:text-brand-black'}`}
                  >
                    Home
                  </button>
                  <button 
                    onClick={() => { setSelectedCategory("Men's Fashion"); setActiveView("shop"); }}
                    className={`pb-1 transition-all ${activeView === 'shop' && selectedCategory === "Men's Fashion" ? 'border-b-2 border-brand-gold text-brand-black' : 'text-neutral-500 hover:text-brand-black'}`}
                  >
                    Men
                  </button>
                  <button 
                    onClick={() => { setSelectedCategory("Women's Fashion"); setActiveView("shop"); }}
                    className={`pb-1 transition-all ${activeView === 'shop' && selectedCategory === "Women's Fashion" ? 'border-b-2 border-brand-gold text-brand-black' : 'text-neutral-500 hover:text-brand-black'}`}
                  >
                    Women
                  </button>
                  <button

                    className={`pb-1 transition-all ${activeView === 'shop' && selectedCategory === 'All Collections' ? 'border-b-2 border-brand-gold text-brand-black' : 'text-neutral-500 hover:text-brand-black'}`}
                  >
                    Catalog
                  </button>
                  <button 
                    onClick={() => { setSelectedCategory("Sale Collection"); setActiveView("shop"); }}
                    className="text-red-700 font-bold hover:text-red-900 transition-colors"
                  >
                    Sale
                  </button>
                </nav>

                {/* Right Action Icons */}
                <div className="flex items-center space-x-4 sm:space-x-6">
                  {/* Search CTA */}
                  <button 
                    onClick={() => { setActiveView("shop"); }} 
                    title="Search" 
                    className="p-2 text-neutral-800 hover:text-brand-goldDark transition-colors"
                  >
                    <Icon name="search" className="w-5 h-5" />
                  </button>

                  {/* Wishlist */}
                  <button 
                    onClick={() => setActiveView("wishlist")} 
                    title="Wishlist" 
                    className="relative p-2 text-neutral-800 hover:text-brand-goldDark transition-colors"
                  >
                    <Icon name="heart" className="w-5 h-5" />
                    {wishlist.length > 0 && (
                      <span className="absolute top-1 right-1 w-4 h-4 bg-red-600 text-white rounded-full text-[10px] flex items-center justify-center font-bold">
                        {wishlist.length}
                      </span>
                    )}
                  </button>

                  {/* Account / Admin Portal Toggle */}
                  <button 
                    onClick={() => setActiveView("account")} 
                    title="Account / Admin" 
                    className="p-2 text-neutral-800 hover:text-brand-goldDark transition-colors flex items-center gap-1.5"
                  >
                    <Icon name="user" className="w-5 h-5" />
                    <span className="hidden lg:inline text-xs font-semibold tracking-wider uppercase">
                      {currentUser?.role === 'admin' ? 'Admin' : 'VIP'}
                    </span>
                  </button>

                  {/* Shopping Bag Button */}
                  <button 
                    onClick={() => setIsCartOpen(true)}
                    className="flex items-center gap-2 bg-brand-black text-white px-4 py-2.5 rounded-full text-xs font-semibold tracking-wider uppercase hover:bg-neutral-800 transition-all shadow-sm"
                  >
                    <Icon name="shopping-bag" className="w-4 h-4 text-brand-gold" />
                    <span>Bag ({cart.reduce((a, b) => a + b.quantity, 0)})</span>
                  </button>
                </div>
              </div>
            </div>
          </header>

          {/* MAIN VIEW CONTENT ROUTER */}
          <main className="flex-1">
            {activeView === "home" && (
              <HomeView 
                products={products}
                onSelectProduct={viewProductDetails}
                onExploreCategory={(cat) => { setSelectedCategory(cat); setActiveView("shop"); }}
                wishlist={wishlist}
                onToggleWishlist={toggleWishlist}
              />
            )}

            {activeView === "shop" && (
              <ShopView 
                products={products}
                selectedCategory={selectedCategory}
                setSelectedCategory={setSelectedCategory}
                searchQuery={searchQuery}
                setSearchQuery={setSearchQuery}
                sortOption={sortOption}
                setSortOption={setSortOption}
                onSelectProduct={viewProductDetails}
                wishlist={wishlist}
                onToggleWishlist={toggleWishlist}
              />
            )}

            {activeView === "product-detail" && selectedProduct && (
              <ProductDetailView 
                product={selectedProduct}
                allProducts={products}
                onSelectProduct={viewProductDetails}
                onAddToCart={addToCart}
                wishlist={wishlist}
                onToggleWishlist={toggleWishlist}
                onBack={() => setActiveView("shop")}
              />
            )}

            {activeView === "checkout" && (
              <CheckoutView 
                cart={cart}
                total={cartTotal}
                onCompleteOrder={(orderDetails) => {
                  setOrders([orderDetails, ...orders]);
                  setCart([]);
                  notify(`Order ${orderDetails.id} confirmed!`);
                  setActiveView("account");
                }}
                onCancel={() => setActiveView("shop")}
              />
            )}

            {activeView === "account" && (
              <AccountAdminView 
                currentUser={currentUser}
                setCurrentUser={setCurrentUser}
                orders={orders}
                setOrders={setOrders}
                products={products}
                setProducts={setProducts}
                onSelectProduct={viewProductDetails}
                notify={notify}
              />
            )}

            {activeView === "wishlist" && (
              <WishlistView 
                wishlistIds={wishlist}
                products={products}

                onAddToCart={addToCart}
                onExploreShop={() => { setSelectedCategory("All Collections"); setActiveView("shop"); }}
              />
            )}
          </main>

          {/* SLIDE-OVER LUXURY SHOPPING BAG */}

            isOpen={isCartOpen}

            }}
          />

          <Footer onNavCategory={(c) => { setSelectedCategory(c); setActiveView("shop"); }} />
        </div>

    // ==========================================
    // 2. SHOP / CATALOG VIEW (Filters & Search)
    // ==========================================
    function ShopView({ 
      products, 
      selectedCategory, 
      setSelectedCategory, 
      searchQuery, 
      setSearchQuery, 
      sortOption, 
      setSortOption, 
      onSelectProduct,
      wishlist,
      onToggleWishlist 
    }) {
      const [maxPrice, setMaxPrice] = useState(1000);

      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          // Category filter
          if (selectedCategory === "New Arrivals" && !p.isNew && p.badge !== "New Arrival") return false;
          if (selectedCategory === "Sale Collection" && !p.originalPrice) return false;
          if (selectedCategory !== "All Collections" && 
              selectedCategory !== "New Arrivals" && 
              selectedCategory !== "Sale Collection") {
            if (p.category !== selectedCategory && p.gender !== selectedCategory) {
              return false;
            }
          }
          // Search query filter
          if (searchQuery.trim() !== "") {
            const q = searchQuery.toLowerCase();
            const matchName = p.name.toLowerCase().includes(q);
            const matchCat = p.category.toLowerCase().includes(q);
            const matchDesc = p.description.toLowerCase().includes(q);
            if (!matchName && !matchCat && !matchDesc) return false;
          }
          // Price filter
          if (p.price > maxPrice) return false;

          return true;
        }).sort((a, b) => {
          if (sortOption === "price-low") return a.price - b.price;
          if (sortOption === "price-high") return b.price - a.price;
          if (sortOption === "rating") return b.rating - a.rating;
          return 0; // featured default
        });
      }, [products, selectedCategory, searchQuery, maxPrice, sortOption]);

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
          {/* Header & Search */}
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-6 pb-8 border-b border-brand-border">

              <span className="text-xs uppercase tracking-[0.25em] text-brand-gold font-bold">The Catalog</span>
              <h1 className="font-luxury text-4xl font-semibold mt-1">
                {selectedCategory}
              </h1>
              <p className="text-xs text-neutral-500 mt-1">
                Displaying {filteredProducts.length} curated luxury garments
              </p>
            </div>

            {/* Live Search Bar */}
            <div className="relative w-full md:w-80">
              <input 
                type="text" 
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="Search jackets, boots, cashmere..."
                className="w-full bg-white border border-brand-border pl-10 pr-4 py-2.5 text-xs rounded-full focus:outline-none focus:border-brand-gold transition-colors"
              />
              <Icon name="search" className="w-4 h-4 text-neutral-400 absolute left-3.5 top-3" />
              {searchQuery && (
                <button 
                  onClick={() => setSearchQuery("")} 
                  className="absolute right-3.5 top-2.5 text-neutral-400 hover:text-black text-xs font-bold"
                >
                  ✕
                </button>
              )}
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-4 gap-8 pt-8">
            {/* Filter Sidebar */}
            <aside className="space-y-8">
              {/* Category selector */}
              <div>
                <h3 className="text-xs font-bold uppercase tracking-widest text-neutral-900 mb-4 pb-2 border-b border-brand-border">
                  Categories
                </h3>
                <ul className="space-y-2 text-xs">
                  {CATEGORIES.map((cat, idx) => (
                    <li key={idx}>
                      <button 
                        onClick={() => setSelectedCategory(cat)}
                        className={`w-full text-left py-1.5 px-2.5 rounded transition-colors flex items-center justify-between ${selectedCategory === cat ? 'bg-brand-black text-brand-gold font-semibold' : 'text-neutral-600 hover:text-black hover:bg-neutral-100'}`}
                      >
                        <span>{cat}</span>
                        {selectedCategory === cat && <Icon name="check" className="w-3.5 h-3.5" />}
                      </button>
                    </li>
                  ))}
                </ul>
              </div>

              {/* Price Filter Slider */}
              <div>
                <div className="flex justify-between items-center mb-2 pb-2 border-b border-brand-border">
                  <h3 className="text-xs font-bold uppercase tracking-widest text-neutral-900">
                    Max Price
                  </h3>
                  <span className="text-xs font-semibold text-brand-goldDark">${maxPrice}</span>
                </div>
                <input 
                  type="range" 
                  min="50" 
                  max="1000" 
                  step="25"
                  value={maxPrice}
                  onChange={(e) => setMaxPrice(Number(e.target.value))}
                  className="w-full accent-brand-gold cursor-pointer"
                />
                <div className="flex justify-between text-[10px] text-neutral-400 mt-1">
                  <span>$50</span>
                  <span>$1,000</span>
                </div>
              </div>

              {/* Sort By Dropdown */}
              <div>
                <h3 className="text-xs font-bold uppercase tracking-widest text-neutral-900 mb-2 pb-2 border-b border-brand-border">
                  Sort By
                </h3>
                <select 
                  value={sortOption}
                  onChange={(e) => setSortOption(e.target.value)}
                  className="w-full bg-white border border-brand-border text-xs px-3 py-2.5 rounded focus:outline-none focus:border-brand-gold"
                >
                  <option value="featured">Featured / Curated</option>
                  <option value="price-low">Price: Low to High</option>
                  <option value="price-high">Price: High to Low</option>
                  <option value="rating">Top Customer Rating</option>
                </select>
              </div>

              {/* Reset filters shortcut */}
              {(selectedCategory !== "All Collections" || searchQuery !== "" || maxPrice < 1000) && (
                <button 
                  onClick={() => {
                    setSelectedCategory("All Collections");
                    setSearchQuery("");
                    setMaxPrice(1000);
                  }}
                  className="w-full py-2 border border-neutral-300 text-xs uppercase tracking-wider font-semibold text-neutral-600 hover:border-black hover:text-black transition-colors"
                >
                  Reset All Filters
                </button>
              )}
            </aside>

            {/* Products Grid */}
            <main className="lg:col-span-3">
              {filteredProducts.length === 0 ? (
                <div className="text-center py-24 bg-white border border-dashed border-neutral-300 rounded p-8">
                  <Icon name="search-x" className="w-12 h-12 text-neutral-300 mx-auto mb-3" />

                  <p className="text-neutral-500 text-xs mt-1 max-w-sm mx-auto">
                    We could not find anything matching your exact filter criteria. Try expanding your search or selecting another category.
                  </p>
                  <button 
                    onClick={() => { setSelectedCategory("All Collections"); setSearchQuery(""); setMaxPrice(1000); }}
                    className="mt-6 px-6 py-2.5 bg-brand-black text-white text-xs uppercase tracking-widest font-semibold hover:bg-neutral-800"
                  >
                    View All Designs
                  </button>
                </div>
              ) : (
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">
                  {filteredProducts.map(product => (
                    <ProductCard 
                      key={product.id}
                      product={product}
                      onSelectProduct={onSelectProduct}
                      isWishlisted={wishlist.includes(product.id)}
                      onToggleWishlist={onToggleWishlist}
                    />
                  ))}
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

                      className={`w-5 h-5 ${wishlist.includes(product.id) ? 'text-red-600 fill-red-600' : ''}`}

                >
                  {tab === "description" ? "Editorial Notes" : tab === "materials" ? "Materials & Care" : "White-Glove Shipping"}
                </button>
              ))}
            </div>

            <div className="py-6 text-sm text-neutral-600 font-light leading-relaxed max-w-3xl">
              {activeTab === "description" && (
                <p>
                  Part of THE CHOICE perpetual luxury series. Conceived for discerning wearers who view personal style as an architectural expression. Each garment undergoes strict quality control and is numbered for provenance.
                </p>
              )}
              {activeTab === "materials" && (
                <ul className="list-disc pl-5 space-y-1">
                  <li>Natural organic fibers harvested using ethical European mills.</li>
                  <li>Hand-buffed horn and recycled gold hardware.</li>
                  <li>Dry clean only with non-toxic hydrocarbon solvents.</li>
                  <li>Store in breathable cedar garment bags (included).</li>
                </ul>

              {activeTab === "delivery" && (
                <p>
                  Complimentary nationwide shipping in Bangladesh (Dhaka, Chittagong, Sylhet, etc.) with Cash on Delivery option. Global orders dispatched through DHL Express with fully insured door-to-door tracking.
                </p>
              )}
            </div>
          </div>

          {/* Related Products Carousel / Grid */}
          {related.length > 0 && (
            <div className="mt-20 border-t border-brand-border pt-12">
              <div className="text-center max-w-xl mx-auto mb-10">
                <span className="text-xs uppercase tracking-[0.3em] text-brand-gold font-bold">Complete The Aesthetic</span>
                <h2 className="font-luxury text-3xl font-semibold mt-1">Related Masterpieces</h2>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                {related.map(p => (
                  <ProductCard 
                    key={p.id}
                    product={p}
                    onSelectProduct={onSelectProduct}
                    isWishlisted={wishlist.includes(p.id)}
                    onToggleWishlist={onToggleWishlist}
                  />
                ))}
              </div>
            </div>
          )}
        </div>
      );

      return (
        <div className="fixed inset-0 z-50 overflow-hidden">
          {/* Backdrop */}
          <div 
            onClick={onClose} 
            className="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity"

            <div className="w-screen max-w-md bg-white border-l border-brand-border shadow-2xl flex flex-col">

              <div className="p-6 border-b border-brand-border flex items-center justify-between">
                <div>
                  <h2 className="font-luxury text-2xl font-bold tracking-tight">Shopping Bag</h2>
                  <p className="text-xs text-neutral-500 uppercase tracking-wider">
                    {cart.reduce((a, b) => a + b.quantity, 0)} Items Selected

                </div>
                <button 
                  onClick={onClose}
                  className="p-2 text-neutral-400 hover:text-black transition-colors"

              {/* Items List */}
              <div className="flex-1 overflow-y-auto p-6 space-y-6">
                {cart.length === 0 ? (
                  <div className="h-full flex flex-col items-center justify-center text-center space-y-4">
                    <Icon name="shopping-bag" className="w-12 h-12 text-neutral-300" />
                    <h3 className="font-luxury text-2xl font-bold">Your Bag is Empty</h3>
                    <p className="text-xs text-neutral-500 max-w-xs">

                    <button

                      className="px-6 py-2.5 bg-brand-black text-white text-xs uppercase tracking-widest font-semibold hover:bg-neutral-800"

                  </div>

                      <img 
                        src={item.image} 
                        alt={item.name}

                      />
                      <div className="flex-1 flex flex-col justify-between">

                              {item.name}

                            <button 
                              onClick={() => onRemove(index)}
                              className="text-neutral-400 hover:text-red-600 text-xs pl-2"
                              title="Remove item"
                            >
                              <Icon name="trash-2" className="w-4 h-4" />
                            </button>
                          </div>
                          <p className="text-xs text-neutral-500 mt-1">
                            Size: <span className="font-medium text-black">{item.size}</span> | Color: <span className="font-medium text-black">{item.color}</span>
                          </p>
                        </div>

                        <div className="flex justify-between items-center mt-3">
                          <div className="flex items-center border border-neutral-200 rounded">
                            <button 
                              onClick={() => onUpdateQty(index, -1)}
                              className="px-2 py-0.5 text-xs text-neutral-600 hover:text-black"
                            >
                              -
                            </button>
                            <span className="px-2 text-xs font-bold">{item.quantity}</span>
                            <button 
                              onClick={() => onUpdateQty(index, 1)}
                              className="px-2 py-0.5 text-xs text-neutral-600 hover:text-black"
                            >
                              +
                            </button>
                          </div>
                          <span className="text-sm font-bold text-black">
                            ${item.price * item.quantity}
                          </span>
                        </div>
                      </div>
                    </div>
                  ))
                )}
              </div>

              {/* Subtotal & Checkout CTA */}
              {cart.length > 0 && (
                <div className="p-6 border-t border-brand-border bg-neutral-50/50 space-y-4">
                  <div className="space-y-1.5 text-xs">
                    <div className="flex justify-between text-neutral-500">
                      <span>Subtotal</span>
                      <span className="text-black font-semibold">${total}</span>
                    </div>
                    <div className="flex justify-between text-neutral-500">
                      <span>Shipping</span>
                      <span className="text-emerald-700 font-semibold">{total >= 250 ? 'FREE (VIP Promo)' : '$20'}</span>
                    </div>
                    <div className="flex justify-between text-base font-bold text-black pt-2 border-t border-neutral-200">
                      <span>Total</span>
                      <span>${total >= 250 ? total : total + 20}</span>

                  <button 
                    onClick={onProceedCheckout}
                    className="w-full py-4 bg-brand-black hover:bg-neutral-800 text-white font-semibold uppercase text-xs tracking-[0.25em] flex items-center justify-center gap-2 transition-all shadow-xl"
                  >
                    <span>Proceed to Checkout</span>
                    <Icon name="arrow-right" className="w-4 h-4 text-brand-gold" />
                  </button>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function CheckoutView({ cart, total, onCompleteOrder, onCancel }) {
      const [formData, setFormData] = useState({
        name: "Tanvir Ahmed",
        phone: "+880 1711 234567",
        email: "tanvir.fashion@example.com",
        district: "Dhaka",
        area: "Gulshan 2",
        address: "House 14, Road 71, Block NW",
        notes: "Please call upon arrival at front security concierge."
      });

      const [paymentMethod, setPaymentMethod] = useState("cod"); // 'cod' or 'card'
      const [isSubmitting, setIsSubmitting] = useState(false);

      const currentAreas = useMemo(() => {
        const found = BANGLADESH_DISTRICTS.find(d => d.name === formData.district);
        return found ? found.areas : [];
      }, [formData.district]);

      const shippingCost = total >= 250 ? 0 : 20;
      const finalGrandTotal = total + shippingCost;

      const handleSubmitOrder = (e) => {
        e.preventDefault();
        setIsSubmitting(true);

        setTimeout(() => {
          const newOrder = {
            id: `TC-${Math.floor(100000 + Math.random() * 900000)}`,
            date: new Date().toISOString().split('T')[0],
            customer: { ...formData },
            items: [...cart],
            subtotal: total,
            shipping: shippingCost,
            total: finalGrandTotal,
            paymentMethod: paymentMethod === 'cod' ? 'Cash on Delivery' : 'Secure Card Authorization',
            status: 'Processing'
          };
          setIsSubmitting(false);
          onCompleteOrder(newOrder);
        }, 1200);

      if (cart.length === 0) {
        return (
          <div className="max-w-2xl mx-auto py-24 px-4 text-center">
            <h2 className="font-luxury text-3xl font-bold">Your Bag is Empty</h2>
            <p className="text-neutral-500 text-sm mt-2 mb-6">Select pieces before checking out.</p>
            <button onClick={onCancel} className="px-6 py-3 bg-black text-white text-xs uppercase tracking-widest font-semibold">

            <button onClick={onCancel} className="text-xs uppercase tracking-widest font-semibold text-neutral-500 hover:text-black flex items-center gap-1 mb-2">
              <Icon name="arrow-left" className="w-4 h-4" /> Return to Store

          <form onSubmit={handleSubmitOrder} className="grid grid-cols-1 lg:grid-cols-12 gap-12">
            {/* Delivery Info */}

              <div className="bg-white p-6 sm:p-8 rounded border border-brand-border space-y-6">
                <h3 className="text-xs font-bold uppercase tracking-[0.2em] text-brand-gold pb-3 border-b border-brand-border flex items-center gap-2">
                  <Icon name="map-pin" className="w-4 h-4" /> 1. Client Delivery Details

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-semibold uppercase tracking-wider mb-1.5">Full Name *</label>
                    <input 
                      type="text" 
                      required 
                      value={formData.name}

                      className="w-full bg-neutral-50 border border-neutral-300 px-3.5 py-2.5 text-xs rounded focus:outline-none focus:border-brand-gold"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold uppercase tracking-wider mb-1.5">Phone Number *</label>
                    <input 
                      type="tel" 
                      required 
                      value={formData.phone}

                    />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold uppercase tracking-wider mb-1.5">Email Address *</label>

                        const newDist = e.target.value;

                      <img src={item.image} alt={item.name} className="w-12 h-14 object-cover rounded bg-neutral-100" />
